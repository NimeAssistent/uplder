<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unggah Gambar</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#14231c;--mute:#5d6f66;--line:#c9d6ce;--acc:#0f7a55;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0e1512;--card:#16201b;--ink:#e8f1ec;--mute:#93a69b;--line:#2c3c34;--acc:#3ecf9a;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 4px;font-size:1.7rem}
.sub{margin:0 0 20px;color:var(--mute)}
#drop{display:block;border:2px dashed var(--line);border-radius:18px;background:var(--card);padding:36px 16px;text-align:center;cursor:pointer}
#drop.over,#drop:hover{border-color:var(--acc)}
#drop:focus-within{outline:3px solid var(--acc);outline-offset:2px}
#drop input{position:absolute;opacity:0;width:1px;height:1px}
#drop strong{display:block;font-size:1.1rem}
#drop span{color:var(--mute);font-size:.9rem}
ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
li{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
li img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
.info{flex:1;min-width:0}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.meta{font-size:.85rem;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta a{color:var(--acc)}
.err{color:var(--err)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
button{font:inherit;font-size:.85rem;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;flex:none}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Unggah gambar</h1>
  <p class="sub">Dapatkan link langsung yang permanen. JPG, PNG, GIF, WEBP, maks. 20 MB.</p>
  <label id="drop">
    <input id="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple>
    <strong>Pilih atau jatuhkan gambar</strong>
    <span>Bisa lebih dari satu file</span>
  </label>
  <ul id="list"></ul>
</main>
<script type="module">
import { upload } from "https://esm.sh/@vercel/blob/client";

var drop=document.getElementById("drop"),input=document.getElementById("file"),list=document.getElementById("list");
var EXT={"image/jpeg":".jpg","image/png":".png","image/gif":".gif","image/webp":".webp"},KEY="riwayat_unggahan";

function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}}
function rand(){var a=new Uint8Array(5);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return("0"+b.toString(16)).slice(-2)}).join("")}

function done(li,r){
  var meta=li.querySelector(".meta"),bar=li.querySelector(".bar");
  if(bar)bar.remove();
  meta.className="meta";meta.innerHTML="";
  var a=document.createElement("a");a.href=r.url;a.target="_blank";a.rel="noopener";a.textContent=r.url;meta.appendChild(a);
  var box=document.createElement("div");box.style.cssText="display:flex;gap:6px;flex:none";
  var c=document.createElement("button");c.type="button";c.textContent="Salin";
  c.onclick=function(){navigator.clipboard.writeText(r.url).then(function(){c.textContent="Tersalin"})};
  var d=document.createElement("button");d.type="button";d.textContent="Hapus";
  d.onclick=function(){
    if(!confirm("Hapus gambar ini secara permanen? Link-nya akan mati."))return;
    fetch("/api/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:r.url,token:r.deleteToken})})
    .then(function(x){return x.json().then(function(j){return{ok:x.ok,j:j}})})
    .then(function(x){
      if(!x.ok&&x.j.error!=="File tidak ditemukan.")throw new Error(x.j.error||"Gagal");
      save(load().filter(function(i){return i.url!==r.url}));li.remove();
    }).catch(function(e){meta.textContent=e.message;meta.className="meta err"});
  };
  box.appendChild(c);box.appendChild(d);li.appendChild(box);
}

function row(name,src){
  var li=document.createElement("li");
  li.innerHTML='<img alt=""><div class="info"><div class="name"></div><div class="meta">Mengunggah…</div><div class="bar"><i></i></div></div>';
  li.querySelector("img").src=src;li.querySelector(".name").textContent=name;
  return li;
}

async function send(f){
  var li=row(f.name,URL.createObjectURL(f));list.prepend(li);
  var meta=li.querySelector(".meta"),bar=li.querySelector(".bar i");
  function fail(t){meta.textContent=t;meta.className="meta err"}
  if(!EXT[f.type])return fail("Format tidak didukung");
  if(f.size>20*1024*1024)return fail("Lebih dari 20 MB");
  try{
    var blob=await upload(rand()+EXT[f.type],f,{access:"public",handleUploadUrl:"/api/upload",
      onUploadProgress:function(p){bar.style.width=p.percentage+"%"}});
    var res=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:blob.url,name:f.name})});
    var r=await res.json();
    if(!res.ok)return fail(r.error||"Gagal mencatat unggahan");
    var h=load();h.unshift({url:r.url,name:f.name,deleteToken:r.deleteToken});save(h.slice(0,200));
    done(li,r);
  }catch(e){fail(e.message||"Gagal diunggah")}
}

function add(files){Array.prototype.forEach.call(files,send)}
input.onchange=function(){add(input.files);input.value=""};
["dragenter","dragover"].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add("over")})});
["dragleave","drop"].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove("over")})});
drop.addEventListener("drop",function(ev){add(ev.dataTransfer.files)});

load().forEach(function(r){var li=row(r.name,r.url);list.appendChild(li);done(li,r)});
</script>
</body>
</html>
